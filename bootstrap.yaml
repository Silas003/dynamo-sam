AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap - GitHub OIDC provider, deployment roles, and artifact buckets for dynamo-sam pipelines

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub username or organization that owns the repository

  GitHubRepo:
    Type: String
    Description: GitHub repository name (without the org prefix)
    Default: dynamo-sam

  CreateOIDCProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if the GitHub Actions OIDC provider already exists in this account

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:


  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd


  DevArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ProdArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: dynamo-sam-deploy-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFormationStackOps
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ListStackResources
            Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/dynamo-sam-*'
          - Sid: CloudFormationValidate
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: CloudFormationTransform
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
            Resource: !Sub 'arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-31'
          - Sid: DynamoDBTableOps
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:ListTagsOfResource
            Resource: !Sub 'arn:aws:dynamodb:*:${AWS::AccountId}:table/Users-*'
          - Sid: ArtifactBucketAccess
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !Sub '${DevArtifactsBucket.Arn}/*'
              - !Sub '${ProdArtifactsBucket.Arn}/*'
          - Sid: ArtifactBucketList
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !GetAtt DevArtifactsBucket.Arn
              - !GetAtt ProdArtifactsBucket.Arn

  

  DevDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-dynamo-sam-dev
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !GetAtt GitHubOIDCProvider.Arn
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:dev'
      ManagedPolicyArns:
        - !Ref DeployPolicy

  ProdDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-dynamo-sam-prod
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !GetAtt GitHubOIDCProvider.Arn
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:prod'
      ManagedPolicyArns:
        - !Ref DeployPolicy


Outputs:
  DevDeployRoleArn:
    Description: Set this as AWS_IAM_ROLE_ARN in the GitHub dev environment variables
    Value: !GetAtt DevDeployRole.Arn

  ProdDeployRoleArn:
    Description: Set this as AWS_IAM_ROLE_ARN in the GitHub prod environment variables
    Value: !GetAtt ProdDeployRole.Arn

  DevArtifactsBucketName:
    Description: Set this as SAM_ARTIFACTS_BUCKET in the GitHub dev environment variables
    Value: !Ref DevArtifactsBucket

  ProdArtifactsBucketName:
    Description: Set this as SAM_ARTIFACTS_BUCKET in the GitHub prod environment variables
    Value: !Ref ProdArtifactsBucket
